name: Gitleaks

on:
  pull_request:
  push:
    branches: [test-github-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 默认只拉取最新的一次提交
        with:
          fetch-depth: 0 # 0 表示拉取完整历史
      - uses: gitleaks/gitleaks-action@v2
        env:
          # 让 gitleaks-action 有权限访问 GitHub 的 API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
